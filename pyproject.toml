[project]
name = "orion-nais"
version = "0.2.2"
description = "A client for the NAIS API from FThe Norwegian Coastal Administration"
authors = [{ name = "Lasse Lambrechts", email = "lasse.lambrechts@bt.no" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "certifi>=2026.10.19",
    "geopandas>=0.12.2,<0.13",
    "fiona>=1.9.3,<1.10",
    "numpy>=1.24.2,<1.25",
    "pandas>=1.5.2,<2",
    "pyproj>=3.5,<3.6",
    "python-dotenv>=0.21.0,<0.22",
    "requests>=2.28.0,<3",
    "shapely>=2.0.1,<2.0.2",
    "pytz>=2022.7.1,<2023",
]

[project.urls]
Repository = "https://github.com/BergensTidende/orion-nais"

[dependency-groups]
dev = [
    "bump2version>=1.0.1,<2",
    "deepdiff>=6.2.3,<7",
    "mypy>=0.991,<1",
    "pyogrio>=0.5.1,<0.6",
    "pytest>=7.2.1,<8",
    "pytest-cov>=4.0.0,<5",
    "ruff>=0.11.0,<0.12",
    "types-pytz>=2022.7.1.0,<2023",
    "types-requests>=2.28.11.7,<3",
]
docs = [
    "Sphinx>=5.3,<6",
    "sphinx-copybutton>=0.5.2,<0.6",
    "sphinx-rtd-theme>=1.1,<2",
    "m2r>=0.3.1,<0.4",
    "attrs>=22,<23",
    "sphinx-autodoc-typehints>=1.23.0,<2",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
# 3rd party import
ignore_missing_imports = true
# dynamic typing
disallow_any_unimported = true
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = true
disallow_any_generics = false
disallow_subclassing_any = true
# platform
python_version = "3.10"
# untyped
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
# None and Optional
no_implicit_optional = true
# Warnings
warn_return_any = false
warn_unreachable = true
# Misc
pretty = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orion"]
